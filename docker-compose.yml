services:
  bot-database:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    networks:
      - bot

  bot-redis:
    image: redis:latest
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      sh -c "redis-server --requirepass $REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - bot

  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    depends_on:
      bot-database:
        condition: service_healthy
      bot-redis:
        condition: service_healthy
    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:3000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

    networks:
      - bot

  bot:
    build:
      context: ./bot
    env_file: ./bot/.env
    depends_on:
      backend:
        condition: service_healthy
      bot-database:
        condition: service_started
      bot-redis:
        condition: service_healthy
    restart: unless-stopped
  
    networks:
      - bot

networks:
  bot:
